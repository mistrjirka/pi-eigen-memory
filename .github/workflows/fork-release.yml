name: Release Eigen fork
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: eigen-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mistrjirka/pi-eigen-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Tag must match package.json version');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## [' + version + ']';
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error('Missing versioned changelog');
          const next = changelog.indexOf('\n## [', start + heading.length);
          fs.writeFileSync('/tmp/eigen-release-notes.md', changelog.slice(start, next < 0 ? undefined : next).trim() + '\n\nInstall: `pi install git:github.com/mistrjirka/pi-eigen-memory`\n');
          JS
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Eigen Memory $RELEASE_TAG" --notes-file /tmp/eigen-release-notes.md
